[project]
name = "roomscan"
version = "0.1.0"
description = "Dimensioned floor plan reconstruction from iPhone LiDAR/video/photo captures"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "jsonschema>=4",
    "Pillow>=10",
    "numpy>=1.24",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["roomscan*"]

[tool.pytest.ini_options]
# A stale, ACL-locked leftover junction in the default %TEMP%/pytest-of-<user>/
# directory (pytest-current, dated 2026-07-15 -- not created by this project)
# makes pytest's own end-of-session temp-dir cleanup crash with
# PermissionError (WinError 5), which swallows the final "N passed" summary
# line even though every test already completed successfully. Pointing
# basetemp at a project-local directory sidesteps that poisoned folder
# entirely instead of fighting Windows ACLs on every run.
addopts = "--basetemp=.pytest_tmp"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
